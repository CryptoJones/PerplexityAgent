[project]
name = "perplexity-agent"
version = "0.1.0"
description = "A simple, security-hardened MCP server exposing the Perplexity Search + Sonar APIs to AI agents (Claude Code, Hermes)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CryptoJones" }]
keywords = ["mcp", "perplexity", "sonar", "research", "agent", "llm"]

# Dependencies are pinned with compatible-release bounds; uv.lock fully locks them.
# (NSA recommendation: choose supported projects, pin dependencies, track vulns.)
dependencies = [
    "mcp>=1.27.2,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pip-audit>=2.10.0",
    "mypy>=1.9",
    "ruff>=0.9.0",
]

[project.scripts]
perplexity-agent = "perplexity_agent.__main__:main"

[project.urls]
Homepage = "https://codeberg.org/CryptoJones/PerplexityAgent"
Mirror = "https://github.com/CryptoJones/PerplexityAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perplexity_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# FastMCP only recognizes a tool's Context parameter when it's annotated as the
# bare `Context` — its find_context_parameter() ignores `Context[...]` generic
# args, so parameterizing it (to satisfy disallow_any_generics) would silently
# break context injection. server.py keeps the bare form; relax that one flag here.
[[tool.mypy.overrides]]
module = "perplexity_agent.server"
disallow_any_generics = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
# S101 asserts, S105/S106 "hardcoded password" false-positives on test fixtures.
"tests/*" = ["S101", "S105", "S106"]
