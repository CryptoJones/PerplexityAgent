# mcp-conformance target config for PerplexityAgent.
# Run from the repo root with the project venv present:
#   /path/to/mcp-conformance/.venv/bin/mcp-conformance run
#
# All three tools (perplexity_search, sonar_ask, deep_research) call the paid
# Perplexity API, so there are NO behavioural probes — invoking them would cost
# money and need a real key. The protocol/schema contracts still run in full;
# the behavioural contracts skip by design. A dummy key lets the server start
# (the key is a SecretStr validated only for presence at startup).
command = [".venv/bin/perplexity-agent"]
env = { PERPLEXITY_API_KEY = "test-dummy-key" }

[expect]
max_output_chars = 200000
