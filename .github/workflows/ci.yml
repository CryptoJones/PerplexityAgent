name: CI

on:
  push:
  pull_request:

# Least privilege: jobs only need to read the repo. CodeQL (separate workflow)
# requests the extra scopes it needs.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra tui --python 3.12
      - name: Ruff lint
        run: uv run ruff check --output-format=github .

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra tui --python 3.12
      - name: mypy
        run: uv run mypy src

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # --extra tui is required: the TUI tests import textual/selectolax.
      - run: uv sync --extra dev --extra tui --python ${{ matrix.python-version }}
      - name: Pytest with coverage gate
        run: >
          uv run pytest -q
          --cov=perplexity_agent
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  conformance:
    name: MCP conformance (live stdio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra tui --python 3.12
      - name: Conformance suite
        # mcp-conformance is a private repo, so this job is a graceful no-op until
        # MCP_CONFORMANCE_TOKEN (a PAT with read access to it) is set in the repo's
        # Actions secrets. Then it boots perplexity-agent over stdio and asserts the
        # baseline contracts (see conformance.toml; a dummy API key lets it start).
        env:
          MCP_CONFORMANCE_TOKEN: ${{ secrets.MCP_CONFORMANCE_TOKEN }}
        run: |
          if [ -z "$MCP_CONFORMANCE_TOKEN" ]; then
            echo "MCP_CONFORMANCE_TOKEN not set — skipping conformance suite."
            exit 0
          fi
          uv pip install "git+https://x-access-token:${MCP_CONFORMANCE_TOKEN}@github.com/CryptoJones/mcp-conformance.git"
          uv run mcp-conformance run -- -q

  security:
    name: Security (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so gitleaks can scan every commit, not just the worktree.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra tui --python 3.12
      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit
      - name: Secret scan (gitleaks, full history)
        # safe.directory: the mounted repo is owned by the runner uid, not the
        # container's root, and git refuses "dubious ownership" without it.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 \
            -c "git config --global --add safe.directory /repo && \
                gitleaks git --redact --verbose /repo"
